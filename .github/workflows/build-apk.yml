name: Build Minecraft APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Create Web App Source
      run: |
        mkdir -p www
        cat << 'EOF' > www/index.html
        <!DOCTYPE html>
        <html lang="tr">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <title>Minecraft Web Edition</title>
            <style>
                body {
                    margin: 0;
                    padding: 0;
                    background: #111;
                    color: white;
                    font-family: Arial, sans-serif;
                    overflow: hidden;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    height: 100vh;
                }
                #game-container {
                    width: 100%;
                    height: 85vh;
                    background: #87CEEB;
                    position: relative;
                    overflow: hidden;
                    border-bottom: 4px solid #333;
                }
                .block {
                    width: 40px;
                    height: 40px;
                    background: #8B5A2B;
                    border: 1px solid #5C4033;
                    position: absolute;
                    bottom: 0;
                }
                #ui {
                    padding: 10px;
                    text-align: center;
                    background: #222;
                    width: 100%;
                    box-sizing: border-box;
                }
                button {
                    background: #5C4033;
                    color: white;
                    border: 2px solid #8B5A2B;
                    padding: 10px 20px;
                    font-size: 16px;
                    font-weight: bold;
                    border-radius: 5px;
                    cursor: pointer;
                }
                button:active {
                    background: #8B5A2B;
                }
            </style>
        </head>
        <body>
            <div id="game-container">
                <div class="block" style="left: 40px;"></div>
                <div class="block" style="left: 80px;"></div>
                <div class="block" style="left: 120px; background: #2E8B57; border-color: #1e5c38;"></div>
            </div>
            <div id="ui">
                <h3>Minecraft Mobil</h3>
                <button onclick="alert('Blok yerleştirildi!')">Blok Koy</button>
            </div>
        </body>
        </html>
        EOF

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create myApp com.minecraft.mobile MinecraftApp
        cd myApp
        rm -rf www
        mv ../www www
        cordova platform add android

    - name: Build APK with Cordova
      run: |
        cd myApp
        cordova build android --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-APK
        path: myApp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
        
